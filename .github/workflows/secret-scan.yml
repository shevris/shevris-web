# Secret scanning gate — free alternative to GitHub Secret Protection ($19/mo).
#
# The gitleaks CLI is MIT-licensed; only the gitleaks-ACTION wrapper requires a
# paid org license — so we install the pinned binary directly, SHA-256 verified.
#
# Coverage (the 4-gate model, minus local pre-commit which husky handles):
#   - PR scans: commits in the PR range only — fast gate on every change
#   - Push scans: the pushed commit range on development/main
#   - Weekly + manual: FULL history audit — catches anything that predates the
#     gate or slipped past it
#
# A nonzero gitleaks exit fails the job → add the check name "gitleaks" to the
# branch-protection required contexts after this lands on development.
name: Secret Scan

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]
  schedule:
    - cron: "23 5 * * 1" # weekly full-history audit, off-peak
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.28.0"
      # SHA-256 of gitleaks_8.28.0_linux_x64.tar.gz from the release's
      # checksums.txt — pinned so a compromised release can't swap the binary.
      GITLEAKS_SHA256: "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks (checksum-verified)
        run: |
          set -euo pipefail
          t="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$t" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${t}"
          echo "${GITLEAKS_SHA256} ${t}" | sha256sum --check -
          tar -xzf "$t" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$t" gitleaks
          test "$(gitleaks version)" = "${GITLEAKS_VERSION}"

      - name: Fetch PR base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${GITHUB_BASE_REF}" --depth=50

      - name: Scan PR commits
        if: github.event_name == 'pull_request'
        run: gitleaks git . --log-opts="origin/${GITHUB_BASE_REF}..HEAD" --redact --verbose

      - name: Scan pushed commits
        if: >-
          github.event_name == 'push' &&
          github.event.before != '0000000000000000000000000000000000000000'
        run: gitleaks git . --log-opts="${{ github.event.before }}..${{ github.sha }}" --redact --verbose

      - name: Full history audit
        if: >-
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           github.event.before == '0000000000000000000000000000000000000000')
        run: gitleaks git . --redact --verbose
