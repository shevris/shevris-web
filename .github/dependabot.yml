version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      next-stack:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      toolchain:
        patterns:
          - eslint*
          - prettier*
          - typescript
          - tailwindcss
          - "@tailwindcss/*"
          - husky
          - lint-staged
          - "@commitlint/*"
    ignore:
      # eslint-config-next's plugin chain caps at ESLint 9 — revisit when it supports 10
      - dependency-name: eslint
        versions: [">=10.0.0"]
      # typescript-eslint does not support TS 7 yet — revisit when it does
      - dependency-name: typescript
        versions: [">=6.0.0"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
